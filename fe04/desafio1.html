<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desafio 1 — Boletim de Notas do Trimestre</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 760px; color: #222; }
    .wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    caption { font-weight: bold; font-size: 1.05rem; padding: 8px 0; text-align: left; }
    th, td { border: 1px solid #bbb; padding: 8px 10px; text-align: center; }
    thead th { background: #2b4c7e; color: #fff; }
    tbody th[scope="row"] { background: #eef2f8; text-align: left; }
    @media print { thead th, tbody th[scope="row"] { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
</head>
<body>
<div class="wrap">
<table>
  <caption>Notas do Trimestre &mdash; Front-End 2026</caption>
  <thead>
    <tr>
      <th scope="col">Aluno</th>
      <th scope="col">HTML</th>
      <th scope="col">CSS</th>
      <th scope="col">JavaScript</th>
    </tr>
  </thead>
  <tbody>
    <tr><th scope="row">Ana</th><td>9,0</td><td>8,5</td><td>8,0</td></tr>
    <tr><th scope="row">João</th><td>7,5</td><td>9,0</td><td>8,5</td></tr>
    <tr><th scope="row">Marina</th><td>8,5</td><td>9,5</td><td>9,0</td></tr>
    <tr><th scope="row">Pedro</th><td>6,5</td><td>7,0</td><td>8,0</td></tr>
    <tr><th scope="row">Larissa</th><td>9,5</td><td>9,0</td><td>9,5</td></tr>
  </tbody>
</table>
</div>
</body>
</html>
