<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desafio 4 — Comparativo de Planos de Curso</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 760px; color: #222; }
    .wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    caption { font-weight: bold; font-size: 1.05rem; padding: 8px 0; text-align: left; }
    th, td { border: 1px solid #bbb; padding: 8px 10px; text-align: center; }
    thead th { background: #2b4c7e; color: #fff; }
    tbody th[scope="row"] { background: #eef2f8; text-align: left; vertical-align: top; }
    td:nth-child(1) { text-align: left; }
    @media print { thead th, tbody th[scope="row"] { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
</head>
<body>
<div class="wrap">
<table>
  <caption>Comparativo de Planos &mdash; 2026</caption>
  <thead>
    <tr>
      <th scope="col">Categoria</th>
      <th scope="col">Recurso</th>
      <th scope="col">Plano Básico</th>
      <th scope="col">Plano Completo</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row" rowspan="3">Aulas</th>
      <td>Vídeos gravados</td><td>Sim</td><td>Sim</td>
    </tr>
    <tr>
      <td>Aulas ao vivo</td><td>Não</td><td>Sim</td>
    </tr>
    <tr>
      <td>Material em PDF</td><td>Sim</td><td>Sim</td>
    </tr>
    <tr>
      <th scope="row" rowspan="2">Projetos</th>
      <td>Projeto guiado</td><td>Sim</td><td>Sim</td>
    </tr>
    <tr>
      <td>Correção individual</td><td>Não</td><td>Sim</td>
    </tr>
    <tr>
      <th scope="row">Suporte</th>
      <td>Fórum da comunidade</td><td>Sim</td><td>Sim</td>
    </tr>
  </tbody>
</table>
</div>
</body>
</html>
